<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>CYBER TRAINING | DAK • KAL • SISOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 10%, #03050f, #000000);
            font-family: 'Share Tech Mono', 'Courier New', 'Fira Code', monospace;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        
        .cyber-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(#0ff1 1px, transparent 1px), linear-gradient(90deg, #0ff1 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }
        
        .cyber-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, 
                rgba(0,255,255,0.03) 0px, 
                rgba(0,255,255,0.03) 2px, 
                transparent 2px, 
                transparent 8px);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
        
        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }
        
        .neon-pulse {
            position: fixed;
            bottom: -200px;
            right: -200px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,255,0.15), transparent);
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        
        .neon-pulse-2 {
            position: fixed;
            top: -200px;
            left: -200px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,0,255,0.1), transparent);
            animation: pulse 5s ease-in-out infinite reverse;
            z-index: 0;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        #root {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* CSS Components */
        .app-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .mute-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(8, 12, 25, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid #0ff;
            border-radius: 60px;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: monospace;
            font-size: 1rem;
            font-weight: bold;
            color: #0ff;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        
        .mute-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
            border-color: #f0f;
            color: #f0f;
        }

        .cyber-card {
            background: rgba(8, 12, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid #0ff;
            border-radius: 48px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.2);
            padding: 1.8rem 1.8rem;
            transition: all 0.3s ease;
            animation: cardGlow 3s ease-in-out infinite;
        }
        
        @keyframes cardGlow {
            0% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.2); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1); }
        }

        .start-screen { text-align: center; }
        
        .glitch {
            font-size: clamp(1.8rem, 7vw, 3rem);
            font-weight: 800;
            text-transform: uppercase;
            color: #0ff;
            text-shadow: 3px 3px 0 #f0f, -2px -2px 0 #0ff;
            letter-spacing: 3px;
            animation: flicker 3s infinite;
            white-space: nowrap;
            display: inline-block;
            margin: 0 auto;
        }
        
        @keyframes flicker {
            0% { opacity: 0.9; text-shadow: 3px 3px 0 #f0f, -2px -2px 0 #0ff; }
            50% { opacity: 1; text-shadow: 2px 2px 0 #0ff, -1px -1px 0 #f0f; }
            100% { opacity: 0.9; text-shadow: 3px 3px 0 #f0f, -2px -2px 0 #0ff; }
        }
        
        .badge-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 16px 0;
        }
        
        .badge-cyber {
            display: inline-flex;
            background: rgba(0, 255, 255, 0.1);
            border-left: 4px solid #0ff;
            padding: 0.4rem 1.2rem;
            font-weight: bold;
            color: #0ff;
            font-size: clamp(0.7rem, 3.5vw, 0.9rem);
            letter-spacing: 1px;
            white-space: nowrap;
        }
        
        .btn-cyber {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 32px;
            margin-top: 24px;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s ease;
            border-radius: 60px;
            box-shadow: 0 0 10px #0ff;
            width: auto;
            display: inline-block;
        }
        
        .btn-cyber:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 30px #0ff;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #0a0f1faa;
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #0ff;
            margin-bottom: 28px;
        }
        
        .timer-neon {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: bold;
            background: #000000aa;
            padding: 6px 18px;
            border-radius: 40px;
            color: #0f0;
            text-shadow: 0 0 8px #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
            animation: timerPulse 1s ease-in-out infinite;
        }
        
        @keyframes timerPulse {
            0% { text-shadow: 0 0 5px #0f0; }
            50% { text-shadow: 0 0 15px #0f0; }
            100% { text-shadow: 0 0 5px #0f0; }
        }
        
        .q-counter {
            color: #0ff;
            background: #11161f;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            border: 1px solid #0ff;
            font-weight: bold;
        }

        .question-text {
            font-size: clamp(1rem, 4.5vw, 1.5rem);
            font-weight: 600;
            line-height: 1.4;
            margin: 20px 0 28px 0;
            color: #f0f3ff;
        }
        
        .q-num {
            display: inline-block;
            background: rgba(0, 255, 255, 0.2);
            padding: 5px 16px;
            border-radius: 30px;
            color: #0ff;
            border: 1px solid #0ff;
            font-size: 0.75rem;
        }
        
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }
        
        .opt-item {
            background: #0c1122cc;
            border: 1px solid #2c3e77;
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        
        .opt-item:active { transform: scale(0.98); background: #2a3a6e; }
        
        .opt-item:hover {
            background: #1f2b4e;
            border-color: #0ff;
            box-shadow: 0 0 12px #0ff3;
        }
        
        .opt-radio {
            width: 18px;
            height: 18px;
            accent-color: #0ff;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .opt-text {
            font-size: clamp(0.8rem, 3.8vw, 0.95rem);
            color: #cbd5f0;
            word-break: break-word;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 32px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: none;
            border: 1.5px solid #0ff;
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: bold;
            font-family: monospace;
            color: #0ff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            flex: 1;
            min-width: 85px;
        }
        
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn.primary { background: #0ff1a; box-shadow: 0 0 8px #0ff; }
        .nav-btn:hover { background: #0ff; color: #000; }
        .submit-final { background: #f0f22; border-color: #f0f; color: #f0f; }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s ease;
            padding: 20px;
        }
        
        .result-modal.show { visibility: visible; opacity: 1; }
        
        .result-card {
            background: #0a0f1f;
            border: 2px solid #0ff;
            border-radius: 48px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px #0ff5;
            position: relative;
            animation: modalZoomIn 0.3s ease;
        }
        
        @keyframes modalZoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .result-header {
            padding: 1.5rem 1.5rem 0.5rem 1.5rem;
            border-bottom: 1px solid #0ff;
            text-align: center;
            position: sticky;
            top: 0;
            background: #0a0f1f;
            border-radius: 48px 48px 0 0;
            z-index: 10;
        }
        
        .result-header h3 { color: #0ff; font-size: 1.5rem; margin-bottom: 10px; }
        .result-score { text-align: center; font-size: 1.5rem; color: #0f0; margin-bottom: 15px; }
        
        .result-list-container {
            overflow-y: auto;
            padding: 1rem 1.5rem;
            flex: 1;
        }
        
        .result-item {
            background: #111827;
            border-radius: 24px;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-left: 5px solid;
            transition: 0.2s;
        }
        
        .result-item.correct { border-left-color: #0f0; background: #0f1a0f; }
        .result-item.wrong { border-left-color: #f0f; background: #1a0f1a; }
        .result-question { font-size: 0.85rem; color: #eef4ff; margin-bottom: 8px; }
        .result-answer { font-size: 0.75rem; color: #94a3b8; }
        .result-answer span { color: #0ff; }
        
        .close-result {
            background: #0a0f1f;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin: 16px 1.5rem 1.8rem 1.5rem;
            font-family: monospace;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .close-result:active { transform: scale(0.95); }
        .close-result:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }

        .thankyou-screen { text-align: center; }
        
        .score-glow {
            font-size: clamp(1.8rem, 7vw, 3rem);
            font-weight: 800;
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
            background: #000000aa;
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            margin: 20px 0;
        }
        
        .message-motivation { font-size: 1rem; color: #f0f; margin: 15px 0; letter-spacing: 1px; }
        .footer-note { margin-top: 24px; color: #6c7a9e; font-size: 0.65rem; }

        @media (max-width: 550px) {
            .cyber-card { padding: 1.2rem; }
            .glitch { white-space: normal; word-break: keep-all; letter-spacing: 2px; }
            .badge-container { gap: 6px; }
            .badge-cyber { padding: 0.3rem 0.8rem; font-size: 0.7rem; }
            .nav-buttons { gap: 6px; }
            .nav-btn { padding: 6px 10px; font-size: 0.7rem; min-width: 70px; }
            .opt-item { padding: 8px 14px; }
            .result-header h3 { font-size: 1.2rem; }
            .result-score { font-size: 1.2rem; }
            .mute-button { padding: 6px 12px; font-size: 0.75rem; top: 12px; left: 12px; }
            .btn-cyber { padding: 10px 24px; font-size: 1rem; }
        }
        
        @media (min-width: 551px) and (max-width: 768px) {
            .cyber-card { padding: 1.5rem; }
            .glitch { white-space: normal; }
            .badge-cyber { padding: 0.35rem 1rem; }
        }
    </style>
</head>
<body>
<div class="cyber-bg"></div>
<div class="neon-pulse"></div>
<div class="neon-pulse-2"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="soal.js"></script>
<script src="app.js"></script>
</body>
</html>
